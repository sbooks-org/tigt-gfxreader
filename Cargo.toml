[package]
name = "tigt-gfxreader"
version = "0.1.0"
edition = "2021"
license = "MIT-0"
description = "Capture terminal screens and recognize exact bitmap glyphs using caller-supplied fonts"
repository = "https://github.com/sbooks-org/tigt-gfxreader"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vte = "0.15"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
